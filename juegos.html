<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sala de Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#3b2f4a; --soft:#7a6b8a; --accent:#e8798f; --oro:#e0a92b;
    --card:#fffdfdee;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    min-height:100dvh; display:block;
    font-family:"Nunito", system-ui, sans-serif; color:var(--ink); padding:clamp(14px,4vh,40px) 14px;
    background:
      radial-gradient(circle at 18% 8%, #ffdfe9 0, transparent 42%),
      radial-gradient(circle at 88% 88%, #dfe4ff 0, transparent 46%),
      radial-gradient(circle at 80% 6%, #fff3cc 0, transparent 36%),
      #fbf5f8;
    overflow-x:hidden; user-select:none; -webkit-user-select:none;
  }
  .app { width:100%; max-width:440px; margin-inline:auto; }

  /* ---------- HUD ---------- */
  .top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .top .volver { border:none; background:#ffffffcc; border-radius:99px; width:40px; height:40px; font-size:1.1rem;
                 cursor:pointer; box-shadow:0 2px 10px #0000000d; color:var(--ink); flex:none; }
  .top h1 { font-family:"Caveat", cursive; font-size:2rem; font-weight:700; line-height:1; flex:1; text-align:center; }
  .chips { display:flex; gap:6px; }
  .chip { background:#ffffffcc; border-radius:99px; padding:7px 12px; font-size:.8rem; font-weight:800;
          box-shadow:0 2px 10px #0000000d; white-space:nowrap; }
  .chip.oro { color:var(--oro); }

  /* ---------- Progreso a ficha ---------- */
  .prog { background:var(--card); border-radius:18px; padding:12px 14px; margin-bottom:12px; box-shadow:0 4px 16px #0000000f; }
  .prog .l { display:flex; justify-content:space-between; font-size:.78rem; font-weight:800; color:var(--soft); margin-bottom:6px; }
  .prog .bar { height:9px; background:#f1e5ec; border-radius:9px; overflow:hidden; }
  .prog .bar div { height:100%; width:0; border-radius:9px; background:linear-gradient(90deg,#f7a1b5,#e0a92b); transition:width .6s cubic-bezier(.2,.9,.3,1); }

  /* ---------- Grilla de juegos ---------- */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .game {
    border:none; border-radius:22px; padding:16px 12px; cursor:pointer; font-family:inherit; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; overflow:hidden;
    box-shadow:0 6px 18px #0000000f; transition:transform .18s cubic-bezier(.2,1.4,.4,1), box-shadow .18s;
  }
  .game:active { transform:scale(.95); }
  .game:hover { transform:translateY(-4px); box-shadow:0 12px 26px #00000018; }
  .game .em { font-size:2.3rem; filter:drop-shadow(0 3px 4px #0002); animation:flot 3s ease-in-out infinite; }
  .game:nth-child(2n) .em { animation-delay:-1.5s; }
  @keyframes flot { 50% { transform:translateY(-5px) rotate(4deg); } }
  .game b { font-size:.95rem; font-weight:900; }
  .game small { font-size:.72rem; color:#00000088; font-weight:700; line-height:1.25; }
  .game .rec { position:absolute; top:7px; right:9px; font-size:.65rem; font-weight:900; color:#00000066; }

  /* ---------- Zona de juego ---------- */
  .zona { position:relative; width:100%; aspect-ratio:3/4; max-height:72dvh; margin:0 auto;
          background:var(--card); border-radius:26px; overflow:hidden; box-shadow:0 14px 34px #3b2f4a1f; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  .domzone { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; }

  .barraJuego { display:flex; justify-content:space-between; align-items:center; gap:8px;
                background:#ffffffdd; border-radius:99px; padding:9px 16px; margin-bottom:10px;
                font-weight:900; font-size:.92rem; box-shadow:0 2px 10px #0000000d; }
  .barraJuego .t { color:var(--accent); }

  /* ---------- Overlay ---------- */
  .ov { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
        gap:9px; padding:24px; text-align:center; background:#fff8fbf2; backdrop-filter:blur(4px); z-index:5; }
  .ov.on { display:flex; animation:fade .3s ease; }
  @keyframes fade { from { opacity:0; transform:scale(.96); } }
  .ov h2 { font-family:"Caveat", cursive; font-size:2.3rem; line-height:1.05; }
  .ov p { color:var(--soft); font-size:.92rem; line-height:1.45; }
  .ov .pts { font-size:3.4rem; font-weight:900; color:var(--accent); line-height:1; }
  .ov .pts small { display:block; font-size:.8rem; color:var(--soft); font-weight:800; letter-spacing:2px; }
  .btn { border:none; border-radius:16px; padding:13px 22px; font-family:inherit; font-weight:900; font-size:.98rem;
         cursor:pointer; background:var(--accent); color:#fff; box-shadow:0 6px 16px #e8798f55;
         text-decoration:none; display:inline-block; transition:transform .15s; }
  .btn:active { transform:scale(.96); }
  .btn.oro { background:var(--oro); box-shadow:0 6px 16px #e0a92b55; }
  .btn.alt { background:#fff; color:var(--ink); box-shadow:0 4px 14px #0000000f; }
  .fila { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

  .links { margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .link { color:var(--soft); font-size:.82rem; text-decoration:none; font-weight:800;
          background:#ffffffaa; padding:9px 15px; border-radius:99px; }
  .oculto { display:none !important; }
  .confeti { position:fixed; top:-20px; font-size:1.3rem; pointer-events:none; z-index:50; animation:caer linear forwards; }
  @keyframes caer { to { transform:translateY(110dvh) rotate(400deg); opacity:.2; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="volver oculto" id="btnVolver" onclick="volverHub()">←</button>
    <h1 id="titulo">Sala de Juegos</h1>
    <div class="chips"><span class="chip oro">🎟️ <span id="chipFichas">0</span></span></div>
  </div>

  <!-- HUB -->
  <div id="hub">
    <div class="prog">
      <div class="l"><span>Progreso a la próxima ficha</span><span id="progTxt">0 / 150</span></div>
      <div class="bar"><div id="progBar"></div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="links">
      <a class="link" href="index.html">🫙 Frasco</a>
      <a class="link" href="ruleta.html">🎡 Ruleta</a>
      <a class="link" href="comida.html">🍽️ Qué comer</a>
    </div>
  </div>

  <!-- JUEGO -->
  <div id="jugar" class="oculto">
    <div class="barraJuego">
      <span id="hudIzq">🍬 0</span>
      <span class="t" id="hudMedio">⏱️ 45</span>
      <span id="hudDer">🏆 0</span>
    </div>
    <div class="zona" id="zona">
      <canvas id="cv" class="oculto"></canvas>
      <div class="domzone oculto" id="dom"></div>
      <div class="ov" id="ov">
        <h2 id="ovT"></h2>
        <p id="ovP"></p>
        <div class="fila" id="ovBtns"></div>
      </div>
    </div>
  </div>
</div>

<script src="juegos.js"></script>
</body>
</html>
