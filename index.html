<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frasco de Mensajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#3b2f4a; --soft:#7a6b8a; --accent:#e8798f; --paper:#fffaf0; --line:#efe2cc;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Nunito", system-ui, sans-serif; color:var(--ink); padding:24px 16px;
    background:
      radial-gradient(circle at 20% 15%, #ffd9e4 0, transparent 40%),
      radial-gradient(circle at 85% 80%, #d9e8ff 0, transparent 45%),
      radial-gradient(circle at 80% 10%, #fff1c9 0, transparent 35%),
      #fbf4f7;
    overflow-x:hidden;
  }
  .card { max-width:420px; width:100%; text-align:center; position:relative; z-index:2; }
  h1 { font-family:"Caveat", cursive; font-size:2.6rem; font-weight:700; line-height:1; }
  .sub { color:var(--soft); margin:6px 0 10px; font-size:.95rem; }
  .progress { display:inline-flex; align-items:center; gap:8px; background:#ffffffaa; border-radius:99px;
              padding:6px 14px; font-size:.8rem; font-weight:600; color:var(--soft); margin-bottom:10px;
              box-shadow:0 2px 10px #0000000d; }
  .progress .bar { width:90px; height:6px; background:#f0e4ea; border-radius:6px; overflow:hidden; }
  .progress .bar div { height:100%; background:linear-gradient(90deg,#f7a1b5,#b9a2f0); width:0; transition:width .6s; }

  /* Frasco SVG */
  .jar-wrap { width:230px; margin:0 auto; cursor:pointer; position:relative; -webkit-tap-highlight-color:transparent; }
  .jar-wrap svg { width:100%; height:auto; display:block; overflow:visible; }
  .jar-wrap:hover #jarBody, .jar-wrap:active #jarBody { animation:wiggle .6s ease; transform-origin:115px 290px; }
  @keyframes wiggle { 20%{transform:rotate(-4deg)} 50%{transform:rotate(3deg)} 80%{transform:rotate(-2deg)} }
  #lid { transition:transform .8s cubic-bezier(.4,-0.5,.4,1.5); transform-origin:115px 40px; }
  #lid.open { transform:translate(120px,-70px) rotate(40deg); }
  .glow { position:absolute; inset:30% 15% 5%; background:radial-gradient(#fff6c6aa, transparent 70%);
          filter:blur(10px); z-index:-1; animation:breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity:.4; transform:scale(.92); } }
  .hint { color:var(--soft); font-size:.95rem; margin-top:10px; }
  .hint b { color:var(--accent); }

  /* Nota */
  .note-wrap { display:none; perspective:900px; margin-top:8px; }
  .note {
    background:var(--paper); border-radius:4px; padding:34px 26px 22px; position:relative; text-align:left;
    background-image:repeating-linear-gradient(transparent 0 33px, var(--line) 33px 34px);
    background-position:0 22px;
    box-shadow:0 1px 0 #e9dcc4, 0 18px 40px #3b2f4a26;
    transform-origin:top center; animation:unfold .9s cubic-bezier(.2,.8,.2,1);
  }
  .note::before { /* cinta */
    content:""; position:absolute; top:-12px; left:50%; width:100px; height:26px;
    transform:translateX(-50%) rotate(-2deg); background:#f6c1cdb3; border-radius:2px;
  }
  .note::after { /* margen rojo */
    content:""; position:absolute; top:0; bottom:0; left:18px; width:1px; background:#f3b6c1;
  }
  .note .num { font-size:.72rem; letter-spacing:3px; color:#b3a3b8; font-weight:800; margin-bottom:6px; }
  .note p { font-family:"Caveat", cursive; font-size:1.75rem; line-height:34px; font-weight:500; min-height:68px; }
  .note .firma { font-family:"Caveat", cursive; text-align:right; font-size:1.4rem; color:var(--accent); margin-top:8px; }
  @keyframes unfold {
    0% { transform:rotateX(-90deg) translateY(-60px) scale(.6); opacity:0; }
    60% { transform:rotateX(12deg); opacity:1; }
    100% { transform:none; }
  }
  .repe { display:none; margin-top:14px; background:#fff; border-radius:16px; padding:12px 14px;
          font-size:.9rem; box-shadow:0 4px 14px #0000000f; }
  .btn { border:none; border-radius:14px; padding:12px 20px; font-family:inherit; font-weight:800; font-size:.95rem;

  .btn:hover { transform:translateY(-2px); }
  .resp { margin-top:14px; background:#fff; border-radius:18px; padding:14px; box-shadow:0 4px 14px #0000000f; text-align:left; }
  .resp .top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .resp .top span { font-size:.9rem; font-weight:700; }
  .heart { border:2px solid #f6c1cd; background:#fff; border-radius:99px; padding:6px 14px; font-family:inherit;
           font-weight:800; cursor:pointer; color:var(--accent); transition:all .2s; }
  .heart.on { background:var(--accent); color:#fff; border-color:var(--accent); transform:scale(1.05); }
  textarea { width:100%; border:2px solid #f0e4ea; border-radius:12px; padding:10px; font-family:inherit; font-size:.95rem;

  textarea:focus { outline:none; border-color:#f6c1cd; }
  .send { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .send small { color:var(--soft); }
  .btn.sm { padding:9px 16px; margin:0; font-size:.9rem; }
  .link { display:inline-block; margin-top:14px; color:var(--soft); font-size:.85rem; text-decoration:none; font-weight:600;

  .next { margin-top:16px; font-size:.85rem; color:var(--soft); }

  .float { position:fixed; bottom:-40px; font-size:1.4rem; animation:up linear forwards; z-index:1; pointer-events:none; }
  @keyframes up { to { transform:translateY(-115vh) rotate(30deg); opacity:0; } }
  .spark { position:fixed; width:6px; height:6px; border-radius:50%; background:#ffe08a; pointer-events:none;

  @keyframes spark { 50% { opacity:0; transform:scale(.3); } }
</style>
</head>

const COLORES = ["#ffc8dd","#bde0fe","#ffe5a3","#caffbf","#e0c3fc","#ffd6a5","#a0e7e5","#fbc4ab"];
const HOY = new Date().toLocaleDateString("en-CA");
const HORA = new Date().getHours();

function leer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function escribir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let vistos = leer("frasco-vistos2", []);   // textos ya leídos
let deHoy  = leer("frasco-hoy2", null);    // { fecha, texto, extra }

// --- Mensajes de la planilla (se suman a los del código) ---
function parseCSV(txt) {
  const filas = []; let f = [], c = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"' && txt[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { f.push(c); c = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && txt[i + 1] === "\n") i++; f.push(c); filas.push(f); f = []; c = ""; }
    else c += ch;
  }
  if (c || f.length) { f.push(c); filas.push(f); }
  return filas;
}
async function cargarPlanilla() {
  if (!PLANILLA) return;
  try {
    const r = await fetch(PLANILLA + (PLANILLA.includes("?") ? "&" : "?") + "t=" + Date.now());
    const filas = parseCSV(await r.text()).slice(1);
    for (const [msg, cat, fecha] of filas) {
      const t = (msg || "").trim(); if (!t) continue;
      const fe = (fecha || "").trim();
      if (fe) { ESPECIALES[fe] = t; continue; }
      const k = (cat || "").trim().toLowerCase();
      const dest = MENSAJES[k] ? k : "carino";
      if (!MENSAJES[dest].includes(t)) MENSAJES[dest].push(t);
    }
  } catch {}
}

function todos() { return Object.values(MENSAJES).flat(); }
function leidos() { return todos().filter(t => vistos.includes(t)).length; }
function actualizarProgreso() {
  const total = todos().length, n = leidos();
  document.getElementById("cnt").textContent = `${n} de ${total} descubiertos`;
  document.getElementById("bar").style.width = (n / total * 100) + "%";
}

// Qué categorías tocan hoy según su ánimo (termómetro) y la hora
function categoriasDeHoy() {
  const animo = leer("animo-hoy", null);
  const mood = animo && animo.fecha === HOY ? animo.mood : null;
  if (mood === "dificil") return ["compania"];
  if (mood === "gris") return ["compania", "cuidados", "carino"];
  if (HORA >= 22 || HORA < 5) return ["noche", "compania", "carino"];
  return ["compania", "carino", "tallas", "preguntas", "cuidados"];
}

function elegir() {
  const esp = ESPECIALES[HOY] || ESPECIALES[HOY.slice(5)];
  if (esp && !vistos.includes(esp + "@" + HOY)) { vistos.push(esp + "@" + HOY); return esp; }
  const pool = categoriasDeHoy().flatMap(c => MENSAJES[c] || []);
  let pend = pool.filter(t => !vistos.includes(t));
  if (!pend.length) pend = todos().filter(t => !vistos.includes(t));
  if (!pend.length) { vistos = []; pend = pool; }   // se rellena el frasco
  return pend[Math.floor(Math.random() * pend.length)];
}

// --- Papelitos y brillitos ---
function llenar() {
  const g = document.getElementById("papers"); g.innerHTML = "";

       </g>`);
  }
  actualizarProgreso();
}

}

let abierto = false, actual = null;
async function abrir() {
  if (abierto) return; abierto = true;
  await listo;
  let texto, repetido = false, nuevo = false;
  if (deHoy && deHoy.fecha === HOY) {
    texto = deHoy.texto;
  } else {
    texto = elegir();
    repetido = vistos.includes(texto);
    deHoy = { fecha: HOY, texto, extra: false };
    vistos.push(texto); nuevo = true;
    escribir("frasco-vistos2", vistos); escribir("frasco-hoy2", deHoy);
  }
  document.getElementById("lid").classList.add("open");
  setTimeout(() => {
    document.getElementById("jarWrap").style.display = "none";
    document.getElementById("hint").style.display = "none";
    mostrar(texto, repetido);
    cuentaRegresiva();
  }, 700);
  if (nuevo) avisar("Abrio el frasco", `🫙 Le salió: "${texto}"`);
}

function mostrar(texto, repetido) {
  actual = texto;
  const wrap = document.getElementById("noteWrap");
  wrap.style.display = "block";
  const note = wrap.querySelector(".note");
  note.style.animation = "none"; note.offsetHeight; note.style.animation = "";
  document.getElementById("num").textContent = "PAPELITO N° " + String(leidos()).padStart(3, "0");
  document.getElementById("texto").textContent = texto;
  document.getElementById("repe").style.display = deHoy.extra ? "none" : "block";
  document.getElementById("repeTxt").textContent = repetido ? "Uy, este ya te había salido 🙈" : "¿Este ya te había salido? 🙈";
  actualizarProgreso();
  llover(["💌","✨","🌸","💛"]);
}

// Si sale repetido, puede sacar otro (uno extra por día)
function sacarOtro() {
  if (deHoy.extra) return;
  const texto = elegir();
  deHoy = { fecha: HOY, texto, extra: true };
  vistos.push(texto);
  escribir("frasco-vistos2", vistos); escribir("frasco-hoy2", deHoy);
  mostrar(texto, false);
  avisar("Saco otro papelito", `🫙 Le salió: "${texto}"`);
}

function cuentaRegresiva() {
  const el = document.getElementById("next");
  const tick = () => {
    const man = new Date(); man.setHours(24, 0, 0, 0);
    const s = Math.floor((man - new Date()) / 1000);
    el.textContent = `Próximo papelito en ${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}min ⏳`;
  };
  tick(); setInterval(tick, 30000);
}

function avisar(titulo, cuerpo, prioridad = "3") {
  fetch("https://ntfy.sh/" + CANAL, {
    method: "POST", body: cuerpo,
    headers: { "Title": titulo, "Tags": "love_letter", "Priority": prioridad }
  }).catch(() => {});
}

function llover(emojis) {
  for (let k = 0; k < 18; k++) {
    const e = document.createElement("div");
    e.className = "float";
    e.textContent = emojis[k % emojis.length];
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = 3 + Math.random() * 3 + "s";
    e.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 7000);
  }
}
