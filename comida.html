<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué como hoy?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3b2f4a; --soft:#7a6b8a; --accent:#e8798f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Nunito", system-ui, sans-serif; color:var(--ink); padding:24px 16px;
    background:
      radial-gradient(circle at 15% 10%, #ffe9d6 0, transparent 42%),
      radial-gradient(circle at 88% 85%, #dcf0e4 0, transparent 45%),
      radial-gradient(circle at 80% 8%, #ffeef5 0, transparent 38%),
      #fdf8f3;
    overflow-x:hidden;
  }
  .card { max-width:420px; width:100%; text-align:center; position:relative; z-index:2; }
  h1 { font-family:"Caveat", cursive; font-size:2.6rem; font-weight:700; line-height:1; }
  .sub { color:var(--soft); margin:6px 0 20px; font-size:.95rem; line-height:1.5; }

  .opts { display:flex; flex-direction:column; gap:11px; }
  .opt {
    border:none; border-radius:20px; padding:16px 18px; font-family:inherit; font-size:1rem; font-weight:800;
    color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:14px; text-align:left;
    box-shadow:0 6px 18px #0000000f; transition:transform .15s, box-shadow .15s;
  }
  .opt:hover { transform:translateY(-3px); box-shadow:0 10px 22px #00000018; }
  .opt span.em { font-size:1.9rem; }
  .opt small { display:block; font-weight:600; color:var(--soft); font-size:.8rem; margin-top:2px; }
  .o-cero { background:#ffe3e8; } .o-poco { background:#fff3cf; }
  .o-ganas { background:#dff3e3; } .o-dulce { background:#ecdcff; }
  .o-salado { background:#ffe8d4; } .o-tomar { background:#dbeefc; }

  .plato {
    display:none; background:#fff; border-radius:26px; padding:28px 22px 22px; position:relative;
    box-shadow:0 16px 40px #3b2f4a1f; animation:pop .5s cubic-bezier(.2,1.3,.4,1);
  }
  .plato .em { font-size:4rem; line-height:1; }
  .plato h2 { font-family:"Caveat", cursive; font-size:2.2rem; font-weight:700; margin:6px 0 2px; }
  .plato .tag { display:inline-block; background:#f7eef2; color:var(--soft); border-radius:99px;
                padding:4px 12px; font-size:.75rem; font-weight:800; letter-spacing:1px; }
  .plato .pasos { text-align:left; margin:16px 0 4px; }
  .plato .pasos li { list-style:none; display:flex; gap:10px; padding:7px 0; font-size:.95rem; line-height:1.4;
                     border-top:1px dashed #f0e4ea; }
  .plato .pasos li b { color:var(--accent); font-weight:800; }
  .nota { color:var(--soft); font-size:.88rem; margin-top:12px; font-style:italic; }
  @keyframes pop { from { transform:scale(.9); opacity:0; } to { transform:none; opacity:1; } }

  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .btn { border:none; border-radius:14px; padding:12px 18px; font-family:inherit; font-weight:800; font-size:.92rem;
         cursor:pointer; background:var(--accent); color:#fff; box-shadow:0 6px 16px #e8798f55; transition:transform .15s; }
  .btn.alt { background:#fff; color:var(--ink); box-shadow:0 4px 14px #0000000f; }
  .btn:hover { transform:translateY(-2px); }
  .listo { display:none; margin-top:16px; font-family:"Caveat", cursive; font-size:1.6rem; color:var(--accent); }
  .link { display:inline-block; margin-top:20px; color:var(--soft); font-size:.85rem; text-decoration:none;
          font-weight:600; background:#ffffffaa; padding:8px 14px; border-radius:99px; }
  .float { position:fixed; bottom:-40px; font-size:1.5rem; animation:up linear forwards; z-index:1; pointer-events:none; }
  @keyframes up { to { transform:translateY(-115vh) rotate(25deg); opacity:0; } }
</style>
</head>
<body>
<div class="card">
  <h1>¿Qué como hoy?</h1>
  <p class="sub" id="sub">Pa que no tengas que pensarlo tú.<br>Todo con lo que ya tienes en la casa 🏠</p>

  <div class="opts" id="menu">
    <button class="opt o-cero" onclick="sugerir('cero')"><span class="em">🛏️</span><span>Cero energía<small>Sin cocinar nada, lo abro y listo</small></span></button>
    <button class="opt o-poco" onclick="sugerir('poco')"><span class="em">🍳</span><span>Un poquito<small>5 minutos máximo, algo calentito</small></span></button>
    <button class="opt o-ganas" onclick="sugerir('ganas')"><span class="em">👩‍🍳</span><span>Ando con ganas<small>Me tinca cocinar algo de verdad</small></span></button>
    <button class="opt o-dulce" onclick="sugerir('dulce')"><span class="em">🍬</span><span>Quiero algo dulce<small>Modo cajón de emergencia</small></span></button>
    <button class="opt o-salado" onclick="sugerir('salado')"><span class="em">🥨</span><span>Quiero algo salado<small>Picoteo, crujiente, con hartita sal</small></span></button>
    <button class="opt o-tomar" onclick="sugerir('tomar')"><span class="em">🍵</span><span>Solo quiero tomar algo<small>Y eso también cuenta</small></span></button>
  </div>

  <div class="plato" id="plato">
    <div class="em" id="pEm"></div>
    <h2 id="pNom"></h2>
    <span class="tag" id="pTag"></span>
    <ul class="pasos" id="pPasos"></ul>
    <p class="nota" id="pNota"></p>
    <div class="row">
      <button class="btn" onclick="otra()">Otra idea</button>
      <button class="btn alt" onclick="comi()">Ya, me sirve 👍</button>
      <button class="btn alt" onclick="volver()">Volver</button>
    </div>
    <p class="listo" id="listo"></p>
  </div>

  <a class="link" href="index.html">🫙 Volver al frasco</a>
</div>

<script>
// ✏️ PERSONALIZA AQUÍ: ideas de comida por nivel de energía
const IDEAS = {
  cero: [
    { e:"🥑", n:"Pan con palta al estilo bueno", t:"2 min", p:["Pan, palta aplastada","Sal, limón y un chorrito de aceite","Si hay ají o merkén, échale"], nota:"El aceite y el limón son la diferencia entre comer y comer rico. Hazme caso." },
    { e:"🍦", n:"Yogurt con gomitas encima", t:"1 min", p:["Un yogurt","Gomitas picadas encima","Cereal o galletas molidas si hay"], nota:"Suena raro, está increíble. Me lo agradeces después." },
    { e:"🥪", n:"Sándwich de tu jamón favorito", t:"2 min", p:["Pan, tu jamón (ese mismo)","Palta o tomate","Sal y listo"], nota:"Sé perfectamente cuál es tu jamón. Que quede claro." },
    { e:"🍌", n:"Plátano con manjar", t:"1 min", p:["Plátano en rodajas","Manjar encima","Maní picado si hay"], nota:"Postre disfrazado de comida. Nadie tiene que saberlo." },
    { e:"🥣", n:"Cereal a las 11 de la noche", t:"2 min", p:["Cereal en un bowl","Leche","Sin culpa, es la ley"], nota:"Comer cereal a deshora es un derecho humano." },
    { e:"🍪", n:"Galletas mojadas en té", t:"3 min", p:["Té bien caliente","Las galletas que haya","Mójalas justo lo necesario"], nota:"Si se te cae una al fondo, es señal de buena suerte (me lo inventé, pero igual)." },
    { e:"🥫", n:"Atún con palta", t:"3 min", p:["Lata de atún escurrida","Palta aplastada, limón y sal","Encima de galletas o pan"], nota:"Tiene proteína, así que te va a dejar realmente mejor, no solo lleno." },
    { e:"🍎", n:"Fruta cortada (truco)", t:"3 min", p:["La fruta que haya","Córtala en trocitos chicos","Sal o limón encima si es ácida"], nota:"Cortada te la comes, entera se pudre en el frutero. Ciencia pura." },
  ],
  poco: [
    { e:"🌯", n:"Fajita floja", t:"5 min", p:["Tortilla al sartén 1 min por lado","Rellena con lo que haya: jamón, palta, huevo","Enróllala apretada"], nota:"La versión floja de tus fajitas. El 80% del sabor con el 20% del esfuerzo." },
    { e:"🍳", n:"Huevos revueltos cremosos", t:"5 min", p:["Huevos batidos con sal","Fuego bajo, revolviendo lento","Sácalos antes de que se vean listos"], nota:"El secreto es fuego bajo y paciencia. Si quedan secos, te fuiste de largo." },
    { e:"🌭", n:"Vienesa envuelta en pan", t:"4 min", p:["Vienesa al microondas 40 seg","Envuélvela en pan de molde","Mayo o palta adentro"], nota:"Comida de las 3 de la mañana, pero a cualquier hora." },
    { e:"🍚", n:"Arroz con huevo frito", t:"8 min", p:["Arroz (mejor si es del día anterior)","Huevo frito con el borde crujiente","Salsa de soya encima"], nota:"Rompe la yema y mézclalo todo. Ahí está la gracia." },
    { e:"🍜", n:"Sopa de sobre mejorada", t:"5 min", p:["La sopa como dice el sobre","Échale un huevo batido en hilo mientras hierve","Un chorrito de limón al final"], nota:"Con el huevo deja de ser sopa de soltero triste." },
    { e:"🥣", n:"Avena que sabe a postre", t:"3 min", p:["Avena con leche en un pocillo","Microondas 1,5 min","Plátano, manjar o miel encima"], nota:"Calentita y suave, ideal cuando el estómago anda apretado." },
    { e:"🥔", n:"Papa al microondas", t:"7 min", p:["Papa pinchada con tenedor","Microondas 5 min","Ábrela, mantequilla, sal y ají de color"], nota:"Parece que cocinaste y no hiciste nada. Tu secreto conmigo." },
    { e:"🍞", n:"Tostadas con manjar y plátano", t:"3 min", p:["Pan bien tostado","Manjar generoso","Plátano en rodajas encima"], nota:"Dulce, crujiente y blandito a la vez. Combinación perfecta." },
  ],
  ganas: [
    { e:"🌮", n:"Fajitas de verdad", t:"20 min", p:["Pollo o carne en tiras con comino y paprika","Cebolla y pimentón salteados aparte","Todo en la tortilla con palta y limón"], nota:"Tus favoritas. Y si sobra relleno, mañana te lo comes con arroz y quedas igual de feliz." },
    { e:"🥖", n:"Churrasco como Dios manda", t:"18 min", p:["Carne en tiras finas, sartén bien caliente","Pan grande, palta y tomate en rodajas","Mayo casera y sal gruesa"], nota:"El truco es que el sartén esté humeando antes de echar la carne. Si no, la carne se cuece en vez de dorarse." },
    { e:"🍝", n:"Tallarines con salsa de la abuela", t:"25 min", p:["Cebolla y ajo bien picados a sofreír","Salsa de tomate, sal, azúcar y orégano","Deja hervir 15 min y échale a los fideos"], nota:"La pizca de azúcar le quita lo ácido al tomate. Ese es el truco de todas las abuelas." },
    { e:"🥞", n:"Panqueques a las 6 de la tarde", t:"20 min", p:["Harina, leche, huevo y una cucharada de azúcar","Al sartén con mantequilla","Manjar y plátano, enrollados"], nota:"Los primeros dos siempre salen feos. Es tradición, no es culpa tuya." },
    { e:"🍟", n:"Chorrillana floja", t:"25 min", p:["Papas fritas o al horno de base","Carne en tiras y cebolla salteada encima","Dos huevos fritos arriba"], nota:"Plato para comer directo del sartén, sentada en el suelo, viendo algo. Es el plan completo." },
    { e:"🍲", n:"Cazuela flojita", t:"30 min", p:["Pollo, papa, zapallo y zanahoria a la olla","Agua, sal y un poco de orégano","Hierve 25 min y échale arroz al final"], nota:"Rinde días. Y el caldo del día siguiente sabe mejor que el primero." },
    { e:"🍞", n:"Tostadas francesas", t:"12 min", p:["Pan remojado en huevo con leche, azúcar y canela","Al sartén con mantequilla hasta dorar","Azúcar flor o manjar encima"], nota:"Sirve el pan medio viejo, incluso mejor. Nada se bota." },
    { e:"🥗", n:"Ensalada que sí llena", t:"15 min", p:["Lechuga o tomate de base","Huevo duro, atún o pollo, y palta","Aceite, limón, sal y un poquito de mostaza"], nota:"Sin proteína te da hambre a la hora. Con proteína aguantas." },
  ],
  dulce: [
    { e:"🍬", n:"Gomitas congeladas", t:"1 min + espera", p:["Gomitas al congelador","Espera un rato","Cómetelas duras"], nota:"Cambian completamente de textura. Pruébalo y después me cuentas." },
    { e:"📺", n:"Gomitas + serie", t:"1 min", p:["Las gomitas que tengas","Algo que ya hayas visto mil veces","Cómetelas de a poquito (o no)"], nota:"Volver a ver algo conocido cansa menos la cabeza. Plan perfecto para día malo." },
    { e:"🗄️", n:"Asalto al cajón", t:"2 min", p:["Abre el cajón de emergencia","Toma lo primero que te tinque, sin pensar","Té calentito al lado"], nota:"Para esto existe el cajón. Úsalo, que para eso está." },
    { e:"🍮", n:"Postre de galletas en vaso", t:"5 min", p:["Galletas molidas en un vaso","Capa de manjar o yogurt","Otra capa de galletas encima"], nota:"Tres capas y parece de pastelería. Nadie necesita saber que demoraste 5 minutos." },
    { e:"🍏", n:"Manzana caliente con canela", t:"5 min", p:["Manzana en cubitos","Azúcar y canela encima","Microondas 3 min"], nota:"La casa queda oliendo increíble. Ese es el verdadero premio." },
    { e:"🥛", n:"Leche con cocoa y galletas", t:"3 min", p:["Leche caliente con cocoa","Azúcar a tu gusto","Galletas al lado para mojar"], nota:"Sabe a cuando uno llegaba del colegio." },
    { e:"🍞", n:"Pan con manjar", t:"1 min", p:["Pan","Manjar","No existe el paso 3"], nota:"Sin discusión posible. Es lo mejor que hay y punto." },
    { e:"🍿", n:"Cabritas dulces", t:"6 min", p:["Cabritas en la olla","Azúcar mientras revientan","Revuelve rápido para que no se queme"], nota:"Ojo: se queman en dos segundos. No te vayas del lado de la olla." },
  ],
  salado: [
    { e:"🍟", n:"Papas fritas dentro del pan", t:"3 min", p:["Pan","Papas fritas de bolsa adentro","Mayo o palta"], nota:"Sé que suena mal. Sé que lo vas a hacer igual. Está buenísimo." },
    { e:"🍿", n:"Cabritas con limón y merkén", t:"6 min", p:["Cabritas como siempre","Limón exprimido encima","Merkén o ají de color y harta sal"], nota:"Una vez que las pruebas así, las normales te van a dar pena." },
    { e:"🥑", n:"Galletas de agua con palta y ají", t:"3 min", p:["Galletas de agua","Palta, sal y limón","Un poquito de ají o pebre encima"], nota:"Crujiente abajo, cremoso arriba, picante al final. Perfecto." },
    { e:"🥚", n:"Huevo duro con sal y ají", t:"11 min", p:["Huevos al agua hirviendo 10 min","Pélalos bajo el agua fría","Sal, pimienta y merkén"], nota:"El agua fría es el truco para que la cáscara salga entera." },
    { e:"🥜", n:"Maní con limón", t:"1 min", p:["Maní salado en un pocillo","Limón exprimido encima","Revuelve y come al tiro"], nota:"Si los dejas mucho rato se ablandan. Cómelos de inmediato." },
    { e:"🌭", n:"Completo de emergencia", t:"8 min", p:["Vienesas al agua caliente","Pan, palta y tomate picadito","Mayo arriba, sin medirse"], nota:"Si no hay pan de completo, el pan normal funciona igual. Nadie se entera." },
    { e:"🧅", n:"Papas rústicas al sartén", t:"14 min", p:["Papas en gajos, sin pelar","Sartén con harto aceite, tapadas 10 min","Sal gruesa, ajo en polvo y orégano al final"], nota:"Tapadas se cuecen por dentro, destapadas se doran. Ese es todo el secreto." },
    { e:"🫓", n:"Pan tostado con aceite y sal", t:"3 min", p:["Pan bien tostado, casi quemado","Aceite de oliva encima","Sal gruesa y orégano"], nota:"La cosa más simple del mundo y no puedes comerte solo uno." },
  ],
  tomar: [
    { e:"🫖", n:"Té con algo dulce al lado", t:"4 min", p:["Tu té favorito","Galletas, gomitas o lo del cajón","Siéntate a tomártelo sin apuro"], nota:"La regla es que tienes que sentarte. Tomárselo de pie no cuenta." },
    { e:"🍵", n:"Té para la cabeza revuelta", t:"3 min", p:["Manzanilla, menta o cedrón","Agua recién hervida","Miel o azúcar"], nota:"Si andas acelerada, este sí ayuda de verdad. El café no." },
    { e:"💧", n:"Un vaso de agua entero", t:"30 seg", p:["Un vaso","Agua","Tómatelo entero, no a sorbitos"], nota:"Suena tonto, pero a veces el bajón es deshidratación disfrazada. Hazme caso." },
    { e:"🥤", n:"Leche con plátano", t:"3 min", p:["Leche, un plátano y azúcar","Todo a la juguera","Canela encima si hay"], nota:"Es casi una comida, así que cuenta doble en días flojos." },
    { e:"🧃", n:"Algo frío y dulce", t:"1 min", p:["Jugo, bebida o agua con limón","Harto hielo"],  nota:"A veces uno no quiere comida, quiere algo helado. Es válido." },
    { e:"☕", n:"Cortado de media tarde", t:"4 min", p:["Café","Leche bien caliente","Azúcar a tu gusto"], nota:"Ojo con la hora: si es tarde, después no vas a poder dormir y me vas a culpar a mí." },
  ],
};

const CIERRES = {
  cero: ["Ya comiste algo. Eso ya es un logro de hoy 💛", "Perfecto. No tenía que ser una gran comida.", "Listo. Ahora descansa tranquila."],
  poco: ["Cocinaste algo. Mírate, tú puedes 💪", "Bien ahí. Eso cuenta harto.", "Te lo ganaste. Come tranquila."],
  ganas: ["¡Qué grande! Después me cuentas cómo quedó 😋", "Me dan ganas de probarlo. Guárdame un poquito.", "Cocinar con ganas es buena señal. Me alegro 💛"],
  dulce: ["Pa eso está el cajón de emergencia 🍬", "Dulce merecido. Sin culpa, ¿ya?", "Perfecto. Los dulces también son cuidado propio."],
  salado: ["Picoteo salado, buena elección 🥨", "Eso es puro antojo y está perfecto.", "Salado y crujiente. Aprobado."],
  tomar: ["Eso también cuenta. En serio 💧", "Bien ahí. Después, si puedes, come algo chiquitito.", "Ya está. Eso ya es cuidarte."],
};

let modo = null, ultima = null;
function sugerir(m) {
  modo = m;
  document.getElementById("menu").style.display = "none";
  document.getElementById("sub").style.display = "none";
  document.getElementById("plato").style.display = "block";
  document.getElementById("listo").style.display = "none";
  otra();
}
function otra() {
  const lista = IDEAS[modo];
  let i; do { i = Math.floor(Math.random() * lista.length); } while (lista[i].n === ultima && lista.length > 1);
  const id = lista[i]; ultima = id.n;
  document.getElementById("pEm").textContent = id.e;
  document.getElementById("pNom").textContent = id.n;
  document.getElementById("pTag").textContent = id.t.toUpperCase();
  const ul = document.getElementById("pPasos"); ul.innerHTML = "";
  id.p.forEach((paso, k) => {
    const li = document.createElement("li");
    li.innerHTML = "<b></b><span></span>";
    li.querySelector("b").textContent = (k + 1) + ".";
    li.querySelector("span").textContent = paso;
    ul.appendChild(li);
  });
  document.getElementById("pNota").textContent = id.nota;
  document.getElementById("listo").style.display = "none";
  const p = document.getElementById("plato");
  p.style.animation = "none"; p.offsetHeight; p.style.animation = "";
}
function comi() {
  const c = CIERRES[modo];
  const el = document.getElementById("listo");
  el.textContent = c[Math.floor(Math.random() * c.length)];
  el.style.display = "block";
  llover([document.getElementById("pEm").textContent, "💛", "✨"]);
}
function volver() {
  document.getElementById("plato").style.display = "none";
  document.getElementById("menu").style.display = "flex";
  document.getElementById("sub").style.display = "block";
}
function llover(emojis) {
  for (let k = 0; k < 14; k++) {
    const e = document.createElement("div");
    e.className = "float";
    e.textContent = emojis[k % emojis.length];
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = 3 + Math.random() * 3 + "s";
    e.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 7000);
  }
}
</script>
</body>
</html>
